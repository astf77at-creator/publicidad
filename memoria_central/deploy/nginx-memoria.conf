# Alternativa a Caddy: usar SOLO si nginx ya ocupa los puertos 80/443.
#
# 1) Copiar a /etc/nginx/sites-available/memoria.yoohoo.mx
# 2) ln -s /etc/nginx/sites-available/memoria.yoohoo.mx /etc/nginx/sites-enabled/
# 3) nginx -t && systemctl reload nginx
# 4) Obtener certificado (certbot edita este archivo y añade el bloque 443):
#       sudo certbot --nginx -d memoria.yoohoo.mx
#
# El registro A de memoria.yoohoo.mx debe apuntar al VPS antes del paso 4.

server {
    listen 80;
    listen [::]:80;
    server_name memoria.yoohoo.mx;

    location / {
        proxy_pass http://127.0.0.1:8742;
        proxy_http_version 1.1;

        proxy_set_header Host              $host;
        proxy_set_header X-Real-IP         $remote_addr;
        proxy_set_header X-Forwarded-For   $proxy_add_x_forwarded_for;
        proxy_set_header X-Forwarded-Proto $scheme;

        # Streamable HTTP del MCP: no bufferizar, permitir streaming.
        proxy_buffering    off;
        proxy_read_timeout 3600s;
        proxy_set_header   Connection "";
    }
}
