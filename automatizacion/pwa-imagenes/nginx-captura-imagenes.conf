# Snippet para /etc/nginx/sites-enabled/captura.yoohoo.mx
# Sirve la página independiente "Imágenes web" como estática bajo el mismo
# dominio/HTTPS. Las llamadas al backend van por /img-api/ (ver ese otro
# location), que hace proxy a FastAPI en 127.0.0.1:8080 (nunca expuesto).
#
# Insertar dentro del server { listen 443 ssl; server_name captura.yoohoo.mx; }

location /imagenes/ {
    alias /var/www/imagenes/;
    try_files $uri $uri/ /imagenes/index.html;
    add_header Cache-Control "no-store, no-cache, must-revalidate" always;
}
