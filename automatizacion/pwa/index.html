<!DOCTYPE html>
<html lang="es">
<head>
<meta charset="UTF-8">
<meta name="viewport" content="width=device-width, initial-scale=1.0">
<meta name="theme-color" content="#1e3a8a">
<link rel="manifest" href="manifest.webmanifest">
<title>Captura de imágenes de producto</title>
<link rel="stylesheet" href="styles.css">
</head>
<body>
  <main class="app">
    <h1>📸 Captura de imágenes</h1>
    <p class="sub">Sube frente y trasero, elige el producto y genera las imágenes.</p>

    <form id="form">
      <fieldset>
        <legend>1 · Fotos del producto</legend>
        <div class="fotos">
          <label class="foto">
            <span>Frente *</span>
            <input type="file" id="frente" accept="image/*" capture="environment" required>
            <img class="preview" id="prev-frente" alt="">
          </label>
          <label class="foto">
            <span>Trasero *</span>
            <input type="file" id="trasero" accept="image/*" capture="environment" required>
            <img class="preview" id="prev-trasero" alt="">
          </label>
        </div>
      </fieldset>

      <fieldset>
        <legend>2 · Producto (desde Odoo)</legend>
        <label>Tipo de prenda
          <select id="tipo" required></select>
        </label>
        <label>Categoría
          <select id="categoria" required></select>
        </label>
        <label>Marca
          <select id="marca" required disabled></select>
        </label>
        <label>Referencia
          <select id="referencia" required disabled></select>
        </label>
      </fieldset>

      <button type="submit" id="enviar">Generar imágenes</button>
    </form>

    <div id="estado" class="estado" hidden></div>
  </main>
  <script src="app.js"></script>
</body>
</html>
