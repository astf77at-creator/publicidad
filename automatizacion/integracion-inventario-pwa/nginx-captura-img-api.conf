# Snippet para el server block HTTPS de captura.yoohoo.mx
# (/etc/nginx/sites-enabled/captura.yoohoo.mx).
#
# Expone el backend FastAPI de automatización de imágenes bajo el MISMO dominio
# y HTTPS de la PWA, sin abrir el puerto 8080 al exterior: el backend escucha
# solo en 127.0.0.1:8080 y nginx hace de reverse proxy.
#
# La PWA llama a /img-api/<endpoint>  ->  http://127.0.0.1:8080/api/<endpoint>
#
# Colocar dentro del `server { ... listen 443 ssl; server_name captura.yoohoo.mx; }`

location /img-api/ {
    proxy_pass http://127.0.0.1:8080/api/;
    proxy_http_version 1.1;
    # /api/jobs responde en streaming (NDJSON, un evento por pose) para la barra
    # de avance: sin buffering nginx reenvía cada chunk en vivo en vez de juntarlos.
    proxy_buffering off;
    proxy_set_header Host $host;
    proxy_set_header X-Real-IP $remote_addr;
    proxy_set_header X-Forwarded-For $proxy_add_x_forwarded_for;
    proxy_set_header X-Forwarded-Proto $scheme;

    # La generación con OpenAI puede tardar; damos margen.
    proxy_read_timeout 300s;
    proxy_send_timeout 300s;
    proxy_connect_timeout 60s;

    # Dos fotos de teléfono pueden pesar; subimos el límite solo para esta ruta.
    client_max_body_size 25M;
}
